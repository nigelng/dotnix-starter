repos:
  - repo: local
    hooks:
      - id: nix-fmt
        name: nix fmt
        # flake formatter is pkgs.nixfmt-tree (treefmt); format then verify with --ci
        entry: bash -c 'nix fmt && nix fmt -- --ci'
        language: system
        pass_filenames: false
        files: \.nix$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^(scripts/.*\.sh|build-darwin\.sh)$
      - id: test-correctness
        name: correctness regressions
        # Nix evals (~15s warm); only when files the harness covers change
        entry: nix develop --command bash scripts/test-correctness.sh all
        language: system
        pass_filenames: false
        files: ^(lib/|darwin/|home/|config/|flake\.(nix|lock)$|build-darwin\.sh$|scripts/test-correctness\.sh$)
