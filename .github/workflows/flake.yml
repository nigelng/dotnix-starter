name: Flake check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: flake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - name: Checkout
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Derive host matrix from config/hosts.json
        id: hosts
        run: |
          hosts=$(jq -c '.hosts' config/hosts.json)
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

  eval:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        # DeterminateSystems/nix-installer-action@v22
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: Set up Cachix
        # cachix/cachix-action@v17 — soft-fail until public cache + CACHIX_AUTH_TOKEN exist
        continue-on-error: true
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: dotnix-starter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Verify host JSON scaffolding
        run: |
          set -euo pipefail
          nix develop --command bash -euc './scripts/validate-host-json.sh'

      - name: Evaluate flake (no build)
        run: nix flake check --no-build --option warn-dirty false

  fmt:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        # DeterminateSystems/nix-installer-action@v22
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: Set up Cachix
        # cachix/cachix-action@v17 — soft-fail until public cache + CACHIX_AUTH_TOKEN exist
        continue-on-error: true
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: dotnix-starter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check Nix formatting
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck scripts/*.sh build-darwin.sh

  check:
    needs:
      - eval
      - setup
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.setup.outputs.hosts) }}
    steps:
      - name: Checkout
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Nix
        # DeterminateSystems/nix-installer-action@v22
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa

      - name: Set up Cachix
        # cachix/cachix-action@v17 — soft-fail until public cache + CACHIX_AUTH_TOKEN exist
        continue-on-error: true
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: dotnix-starter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build host check
        run: nix build --option warn-dirty false '.#checks.aarch64-darwin.${{ matrix.host }}'
